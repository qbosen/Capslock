# keymap.html 的全部文字与布局配置。
#
# 目标：改快捷键、改说法、改界面文案，都只动这个文件和 capslock.yml / external.yml，
# 然后 `make keymap` 重新生成，不需要碰 bin/keymap.py 或模板 HTML。
#
# 各段用途：
#   ui        —— 网页上的所有界面文字（标题、视图名、提示语、按钮）
#   layers    —— 位面如何分簇、怎么命名
#   groups    —— capslock.yml 里各规则组的中文名与一句话说明
#   actions   —— 动作中文对照表；键位描述里等号右边的原文查这张表
#   symbols   —— 修饰键符号
#   keys      —— 按键在界面上的显示名
#   keyboards —— 键盘视图与全览视图的物理布局，[键码, 键帽, 宽度]

ui:
  title: Capslock 键位图
  search_placeholder: 搜索快捷键…
  views:
    sheet: 速查表
    overview: 位面全览
    board: 键盘
    groups: 功能
    drill: 练习
  sheet:
    title: Capslock 键位速查表
    subtitle: "{config} · {count} 条映射 · ⇪ = 按住 CapsLock（Hyper），其后为同时按住的修饰键"
    tip: 按功能分组的单页速查表，A4 横向可完整打印
    btn_png: 下载 PNG
    btn_copy: 复制为图片
    btn_print: 打印 / 存为 PDF
    msg_png: 已下载 PNG（2 倍分辨率）
    msg_copy: 已复制到剪贴板，可直接粘贴
    msg_copy_fail: 复制失败（浏览器限制），请改用「下载 PNG」
    continued: "（续）"
    # 应用类快捷键越攒越多，速查表可以按组隐藏——隐藏结果同样作用于导出的 PNG / PDF
    filter_title: 显示分组
    filter_all: 全选
    filter_none: 全不选
    filter_focus: 只看核心
    filter_state: "{shown}/{total} 组 · {count} 条"
  board:
    detail_title: 按键详情
    detail_hint: 点任意高亮键，看它在所有位面上的映射；当前位面会高亮标注。
    detail_empty: 这个键没有任何映射。
    current_layer: 当前位面
    detail_count: "{key} · {n} 个位面有映射"
  groups_view:
    nav_title: 功能分类
    all: 全部
    empty: 没有匹配「{q}」的快捷键。
    # 没有归入任何一级分类的组，兜底放这里
    other: 其他
  meta: "{count} 条映射 · {layers} 个位面 · {groups} 个功能组"
  plane_count: "{n} 个键"
  cluster_planes: "{n} 个位面"
  current_config_suffix: （当前使用）
  footer: "bin/keymap.py 生成 · 数据源 {sources} · 改完配置跑 make keymap 重新生成"
  no_output: （无输出）
  # 同一功能组里，标签和动作完全一致的多个键位（如跳屏的 1 和 Q）在列表视图合并成一行；
  # 键盘视图仍然各自高亮，因为它们在空间上确实是不同的键
  # 速查表/功能视图上的开关：把 M3/M4 能替代的 Hyper 组合直接显示成 M 键，便于记忆
  macro_toggle: 用 M 键显示
  macro_hint: 把 M3/M4 可替代的 Hyper 组合显示成宏键
  merge_aliases: true
  alias_sep: " / "
  screen_jump: "跳到屏幕{n} · {short}"

# ── 练习页 ─────────────────────────────────────────────────────────
# 分三种练法，依据是「浏览器到底看不看得见这一下」：
#   text    Karabiner 改写后浏览器收得到，输入框里能真看到光标动、字被删
#   pointer 鼠标模式：指针真在动，靶场里点得中
#   card    会把浏览器切走、或压根到不了浏览器（唤起应用 / 窗口管理 / 应用内），只能闪卡自测
# 没列进 text / pointer 的组一律当 card；text 组里判不出输出信号的条目会自动降级成 card。
practice:
  exam_size: 12
  kinds:
    text: [Hyper Navigation, Hyper Deletion, Hyper Shifter, Hyper Terminal]
    pointer: [Hyper Mouse Mode, Hyper Mouse (Neru)]
  # 打开练习页时默认勾选的组：光标移动、删除、符号、鼠标（窗口组不在 text 名单里，自动是闪卡）
  focus: [Hyper Navigation, Hyper Deletion, Hyper Shifter, Hyper Mouse Mode]
  # 这些输出会切走标签页、抢走焦点或弹系统面板，真按下去练不成，降级为闪卡
  block_signals:
    [cmd+Tab, cmd+shift+Tab, ctrl+Tab, ctrl+shift+Tab,
     ctrl+ArrowLeft, ctrl+ArrowRight, ctrl+ArrowUp, ctrl+ArrowDown,
     "cmd+~", "cmd+`", cmd+h, cmd+ctrl+f, "cmd+opt+-", "cmd+opt+=",
     cmd+ctrl+d, cmd+ctrl+opt+S, Escape]
  sample: |
    Karabiner 把 CapsLock 变成 Hyper，左手不用离开主键区。
    hjkl move the caret, and ⌥ jumps by word.
    第三行用来练删除：this line will be deleted.
  ui:
    tip: 光标放进输入框直接按快捷键，页面判定的是 Karabiner 发出的信号。想停随时停，不记成绩。
    modes: { free: 自由模式, exam: 考试模式 }
    mode_hint:
      free: 随便按，右侧实时告诉你刚触发了什么；提示一直摆着，不计分
      exam: 从选中的组里抽题，答对进下一题，最后给一份生疏度报告
    start: 开始考试
    restart: 再来一轮
    stop: 结束
    groups_title: 练哪些
    focus_btn: 核心四组
    all_btn: 全选
    none_btn: 清空
    empty: 先在上面选至少一个分组。
    # 三种练法在题面上的说明
    kind_text: 在输入框里真按一次
    kind_pointer: 进鼠标模式打靶
    kind_card: 闪卡自测 · 打出这个组合键
    kind_tag: { text: 真练, pointer: 打靶, card: 闪卡 }
    kind_note:
      text: 光标已经放好，直接按。判的是 Karabiner 发出的信号，不是你按了哪几个键。
      pointer: 先按 ⇪R 或 M2 进鼠标模式，再用 hjkl 把指针挪到靶心点一下（f 或 ⏎ 左键）。
      card: 这条会把浏览器切走，没法真按——把组合键打出来就行，⌘ / cmd / command 都认。
    prompt: 怎么做到
    answer_placeholder: 打出组合键，如 cmd shift l
    check: 判定
    reveal: 看答案
    skip: 跳过
    right: 对了
    wrong: 不对，再试一次
    revealed: 答案是 {combo}
    live_title: 刚刚按下
    live_none: 按点什么试试
    live_unknown: "{sig} —— 没有对应的快捷键"
    live_hit: "{combo} · {label}"
    hints_title: 提示
    hints_toggle: 显示提示
    progress: "{i}/{n} · 对 {ok}"
    report_title: 这轮结果
    report_line: "正确率 {rate}% · 平均 {ms} 秒 / 题"
    report_weak: 还生疏的
    report_perfect: 全对，这几组可以往难的位面挪了。
    range_hint: 靶子出现在这块区域里，命中 {hit} 个
    stats_reset: 清空练习记录
    stats_note: 练习记录只存在这台机器的浏览器里

# 位面分簇：Hyper 系和原生组合各排一行，簇内按条数从多到少
layers:
  clusters:
    - { match: hyper, tag: Hyper, note: 按住 CapsLock }
    - { match: mod, tag: 原生, note: 不经 CapsLock }
  hyper_alone: Hyper 单键
  hyper_prefix: "Hyper + "
  no_modifier: 无修饰键
  firmware: 键盘固件层
  # 某些位面有单键触发器（Q10 宏键），在标签和标题上标出来
  # 应用内快捷键各自成面，位面名就是应用名
  app_scope: 应用内
  triggers:
    hyper+left_control: M3
    hyper+left_control+left_shift: M4
  # 带 variable_if 条件的规则单独成面：这些键只在对应模式里生效。
  # 一条规则挂多个模式条件时（区域定位 = 鼠标模式 + 按住 Tab），位面名按这里的顺序拼起来。
  modes:
    mouse_mode: 鼠标模式
    zone: 按住 Tab
    # ⇪⌘⌥ 的替身：左小指按 CapsLock、无名指按 Tab，避开双拇指压 ⌘⌥。
    # 和 zone 用的是同一个 Tab，但那条要求 mouse_mode=1 且不带任何修饰键，撞不上。
    wide: 按住 Tab
  mode_sep: " · "
  # 同一个键的快慢变体不单独列出。鼠标加减速已改用 speed_multiplier（实时生效），
  # 不再靠变量分档，所以这里暂时是空的——以后有别的变体变量再往里加。
  variant_conditions: []

# 功能视图的一级分类。二级就是下面 groups 段和 external/apps/keyboard 里的各个组，
# 按这里列的顺序排。没被列进来的组自动落到最后的「其他」，不会丢。
# 想调整归属或顺序，改这里就行，不用动 HTML。
categories:
  - id: text
    zh: 文本编辑
    note: 手不离主键区完成移动、选择、删改
    groups: [Hyper Navigation, Hyper Deletion, Hyper Shifter]
  - id: mouse
    zh: 鼠标
    note: 不碰鼠标完成定位、点击、滚动
    groups: [Hyper Mouse (Neru), Hyper Mouse Mode]
  - id: app
    zh: 应用与窗口
    note: 唤起应用、摆放窗口
    groups: [Hyper Window, Hyper Application, "ext:应用唤起", "ext:窗口管理"]
  - id: dev
    zh: 终端与开发
    note: 终端控制键，在任何终端和编辑器里都通用
    groups: [Hyper Terminal]
  - id: ghostty
    zh: Ghostty
    note: 唤起终端与应用内分屏，只在 Ghostty 前台生效
    groups: [Cmd + Esc Toggle, "app:Ghostty:分屏", "app:Ghostty:分屏尺寸", "app:Ghostty:终端杂项"]
  - id: tool
    zh: 工具
    note: 翻译、截图、系统级功能
    groups: ["ext:Bob 翻译", "ext:截图与识别", "ext:系统"]
  - id: kb
    zh: 键盘
    note: CapsLock 本身，以及 Q10 固件层
    groups: [CapsLock to Hyper, Q10 Macro Keys, "hw:键盘宏键", "hw:键盘 Fn 层"]

# groups
groups:
  Q10 Macro Keys:
    zh: Q10 宏键
    note: M1-M5 统一发 F20-F24 裸键，语义全在 Karabiner，改用途不用重刷键盘
  CapsLock to Hyper:
    zh: 基础映射
    note: CapsLock 本身的双重身份，以及系统级切换
  Hyper Navigation:
    zh: 光标移动与选择
    note: hjkl 四向 + uiop 翻页行首尾；⌘ 变选择，⌥ 放大粒度（按词 / 三行 / 移动行）；
      ⌘⌥（＝按住 Tab）是大粒度选择，U/P 上放的是扩展 / 收缩选择
  Hyper Window:
    zh: 窗口与桌面
    note: 标签页、应用、同应用窗口、桌面切换；⌃⇧ 层是 ⇧ 层的副本，供 M4 单键触发
  Hyper Deletion:
    zh: 删除
    note: 全在 N / M 两个键上——行看单位大小（M 字符 / N 词），列看范围（⇪ 往回 · ⌘ 整行 · ⌥ 往前）
  Hyper Application:
    zh: 应用切换
    note: 一键唤起 / 隐藏常用应用
  Hyper Terminal:
    zh: 终端控制键
    note: 终端与编辑器通用的 ⌃ 系控制键，以及 VSCode 调试
  Hyper Shifter:
    zh: 符号输入
    note: 括号在底排 , . 上（中指+无名指各管一边）；其余是角落里够不着的符号
  Hyper Mouse (Neru):
    zh: 键盘鼠标
    note: 不碰鼠标完成点击、滚动、定位
  Hyper Mouse Mode:
    zh: 鼠标模式
    note: 两种进法——按住 M2 是临时的，松开就退；⇪R 是常驻的，点一下 space 或 esc 退出。
      按住 Tab 时右手主键区变成屏幕缩略图，一键跳到任意区域；按住 ` 拖动
  Cmd + Esc Toggle:
    zh: 唤起终端
    note: ⌘+Esc 唤起 / 收起 Ghostty

