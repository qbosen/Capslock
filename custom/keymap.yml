# symbols
symbols:
  # CapsLock 映射出的 Hyper，位面前缀和组合键里都用它
  hyper: ⇪
  left_command: ⌘
  right_command: ⌘
  left_option: ⌥
  right_option: ⌥
  left_shift: ⇧
  right_shift: ⇧
  left_control: ⌃
  right_control: ⌃
  fn: fn
  caps_lock: ⇪

# keys
keys:
  # 修饰键本身被当作按键使用时（比如鼠标模式里按住 ⌥ 减速）的显示名
  left_option: ⌥
  left_command: ⌘
  left_shift: ⇧
  left_control: ⌃
  knob: 旋钮
  m1: M1
  m2: M2
  m3: M3
  m4: M4
  m5: M5
  # Karabiner 侧用 F20-F24 接收，界面上仍按宏键名显示
  f20: M1
  f21: M2
  f22: M3
  f23: M4
  f24: M5
  left_arrow: ←
  right_arrow: →
  up_arrow: ↑
  down_arrow: ↓
  return_or_enter: ⏎
  delete_or_backspace: ⌫
  delete_forward: ⌦
  spacebar: 空格
  escape: esc
  tab: ⇥
  caps_lock: ⇪
  page_up: PgUp
  page_down: PgDn
  home: Home
  end: End
  grave_accent_and_tilde: '`'
  open_bracket: '['
  close_bracket: ']'
  semicolon: ;
  quote: ''''
  comma: ','
  period: .
  slash: /
  hyphen: '-'
  equal_sign: '='
  backslash: \

# 键盘布局：每项 [键码, 键帽显示, 宽度(u)]
# full    —— 键盘视图用的完整布局
# compact —— 全览视图用的紧凑布局，去掉了用不到的功能键与修饰键
keyboards:
