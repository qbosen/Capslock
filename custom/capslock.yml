      - description: 'mouse mode: zone h = zone 中左'
        type: basic
        from: { key_code: h }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 50% } } } ]

      - description: 'mouse mode: zone j = zone 中中左'
        type: basic
        from: { key_code: j }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 50% } } } ]

      - description: 'mouse mode: zone k = zone 中正'
        type: basic
        from: { key_code: k }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50% } } } ]

      - description: 'mouse mode: zone l = zone 中中右'
        type: basic
        from: { key_code: l }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 70%, y: 50% } } } ]

      - description: 'mouse mode: zone semicolon = zone 中右'
        type: basic
        from: { key_code: semicolon }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 90%, y: 50% } } } ]

      - description: 'mouse mode: zone n = zone 下左'
        type: basic
        from: { key_code: n }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 83% } } } ]

      - description: 'mouse mode: zone m = zone 下中左'
        type: basic
        from: { key_code: m }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 83% } } } ]

      - description: 'mouse mode: zone comma = zone 下正'
        type: basic
        from: { key_code: comma }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 83% } } } ]

      - description: 'mouse mode: zone period = zone 下中右'
        type: basic
        from: { key_code: period }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 70%, y: 83% } } } ]

      - description: 'mouse mode: zone slash = zone 下右'
        type: basic
        from: { key_code: slash }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 90%, y: 83% } } } ]

      - description: 'mouse mode: h = mouse move left'
        type: basic
        from: { key_code: h }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { x: -1600 } } ]

      - description: 'mouse mode: l = mouse move right'
        type: basic
        from: { key_code: l }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { x: 1600 } } ]

      - description: 'mouse mode: j = mouse move down'
        type: basic
        from: { key_code: j }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { y: 1600 } } ]

      - description: 'mouse mode: k = mouse move up'
        type: basic
        from: { key_code: k }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { y: -1600 } } ]

      - description: 'mouse mode: y = mouse wheel left'
        type: basic
        from: { key_code: y }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { horizontal_wheel: 64 } } ]

      - description: 'mouse mode: o = mouse wheel right'
        type: basic
        from: { key_code: o }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { horizontal_wheel: -64 } } ]

      - description: 'mouse mode: u = mouse wheel down'
        type: basic
        from: { key_code: u }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { vertical_wheel: 64 } } ]

      - description: 'mouse mode: i = mouse wheel up'
        type: basic
        from: { key_code: i }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { vertical_wheel: -64 } } ]

      #==========================================================#
      # ( 修饰键 ) 变速与拖拽                                    #
      #  模式内没有按住 CapsLock，⌥⌘⇧ 三个修饰键全是空的。        #
      #  ⌥ 加速：和文本导航里 ⌥「按词跳」的加速语义保持一致。      #
      #  按住只置一个变量，具体快多少由上面每条移动规则自己决定。  #
      #  ⇧ 拖拽可以和 ⌥/⌘ 叠加，用于精细框选。                    #
      #==========================================================#

      # 加减速用 speed_multiplier，不用变量：变量条件只在按键按下那一刻求值，
      # 已经在移动中的 hjkl 不会因为变量变了就重新选规则——这是「移动中调速无效」的根因。
      # speed_multiplier 是持续生效的乘数，对正在进行的移动实时起作用，
      # 所以可以按住 hjkl 不松手，中途再按 ⌘/⌥ 变速。
      #
      # 数值沿用上游 Vonng/Capslock 的设计：三档是严格对称的 0.5 / 1 / 2，
      # 指针和滚轮共用同一套比例。这一点很关键——正因为两边同比例，
      # speed_multiplier 全局生效才不成问题：
      #   指针  800 / 1600 / 3200
      #   滚轮   32 /   64 /  128
      # 想改倍率的话记住它同时作用于两者，别只盯着指针调。
      #
      # 已知偏差：同时按 hjkl 里的两个键斜着走，合速度是 √2 倍（约快 41%）。
      # 上游是给对角线单独分配按键并除以 √2 来解决的，我们用组合键就没这个余地。
      #
      # ⌘ 放加速：拇指自然落点离 ⌘ 最近，而加速比减速用得多。
      - description: 'mouse mode: command = mouse fast'
        type: basic
        from: { key_code: left_command }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { speed_multiplier: 2 } } ]

      - description: 'mouse mode: option = mouse slow'
        type: basic
        from: { key_code: left_option }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { speed_multiplier: 0.5 } } ]

      # ⌃ 拖动主要给 ⇪R 常驻模式用——那时左手完全空闲，拇指按 ⌃ 最省事。
      # 按住 M2 的临时模式下用不上（拇指要留给 ⌘/⌥ 变速），那边走 ` 键。
      # ⇧ 已删：按住 M2 时左小指钉在最左列，和 ⇧ 是同一根手指，够不着。
      - description: 'mouse mode: control = mouse select'
        type: basic
        from: { key_code: left_control }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # ` 在 Tab 正上方，同一根无名指上下一格：下面定位，上面拖动。
      # 和 ⇧ / ⌃ / F / N 一样都是 button1——按住即拖，松开即放。
      - description: 'mouse mode: grave = mouse select'
        type: basic
        from: { key_code: grave_accent_and_tilde }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # Tab 按住 = 进区域定位层。M2 就在 Tab 左边，小指按 M2、无名指按 Tab，
      # 两个相邻键。连续拖拽仍然可以按住 ⇧ / ⌃ / F / N（都是同一个 button1）。
      - description: 'mouse mode: tab = zone layer'
        type: basic
        from: { key_code: tab }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { set_variable: { name: zone, value: 1 } } ]
        to_after_key_up: [ { set_variable: { name: zone, value: 0 } } ]

      - description: 'mouse mode: enter = mouse left click'
        type: basic
        from: { key_code: return_or_enter }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # 点击全部收在右手：n/m 就在 j/k 正下方，移动指针的手指顺势下落就能点。
      # 左手的 f/g 已删——按住 M2 时左手在最左列，那两个键本来就不顺手。
      - description: 'mouse mode: n = mouse left click'
        type: basic
        from: { key_code: n }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      - description: 'mouse mode: m = mouse right click'
        type: basic
        from: { key_code: m }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button2 } ]

      - description: 'mouse mode: a = mouse back'
        type: basic
        from: { key_code: a }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button4 } ]

      - description: 'mouse mode: d = mouse forward'
        type: basic
        from: { key_code: d }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button5 } ]

      #==========================================================#
      # ( 123 / qwe ) 指针跳到第 N 块屏幕正中                     #
      #==========================================================#

      - description: 'mouse mode: 1 = jump to screen 1'
        type: basic
        from: { key_code: '1' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 1 } } } ]

      - description: 'mouse mode: q = jump to screen 1'
        type: basic
        from: { key_code: q }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 1 } } } ]

      - description: 'mouse mode: 2 = jump to screen 2'
        type: basic
        from: { key_code: '2' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 0 } } } ]

      - description: 'mouse mode: w = jump to screen 2'
        type: basic
        from: { key_code: w }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 0 } } } ]

      - description: 'mouse mode: 3 = jump to screen 3'
        type: basic
        from: { key_code: '3' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 2 } } } ]

      - description: 'mouse mode: e = jump to screen 3'
        type: basic
        from: { key_code: e }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 2 } } } ]

      #==========================================================#
      # ( space / esc ) 退出                                     #
      #==========================================================#

      - description: 'mouse mode: space = exit mouse mode'
        type: basic
        from: { key_code: spacebar }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_variable: { name: zone, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }

      - description: 'mouse mode: escape = exit mouse mode'
        type: basic
        from: { key_code: escape }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }
