  ################################################################
  #                        Hyper Shifter                         #
  ################################################################
  - description: Hyper Shifter
    manipulators:

      #==========================================================#
      # [] -> () command:{}  option:<>
      #==========================================================#
      # 括号搬到底排的 , . ：右手中指 + 无名指各管一边，左键出左括号、右键出右括号，
      # 空间关系和符号本身同构。⇧, = < 和 ⇧. = > 在标准布局里本来就是括号类，位置有先验联想。
      # 只输出单个原生字符，成对补全交给编辑器自己处理，两层职责不重叠。
      - description: 'comma , = ('
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '9' , modifiers: [ left_shift ] } ]

      - description: 'command + comma , = {'
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: open_bracket , modifiers: [ left_shift ] } ]

      - description: 'option + comma , = ['
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: open_bracket } ]

      - description: 'period . = )'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '0' , modifiers: [ left_shift ] } ]

      - description: 'command + period . = }'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: close_bracket , modifiers: [ left_shift ] } ]

      - description: 'option + period . = ]'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: close_bracket } ]

      - description: 'semicolon = _'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: 'hyphen' , modifiers: [ left_shift ] } ]

      - description: 'command + semicolon = -'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: hyphen } ]

      - description: 'option + semicolon = $'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '4' , modifiers: [ left_shift ] } ]

      - description: 'quote = equal_sign'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: equal_sign } ]

      - description: 'command + quote = +'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: equal_sign , modifiers: [ left_shift ] } ]

      - description: 'option + quote = &'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '7' , modifiers: [ left_shift ] } ]

      # 斜杠组：三个「手必须够到键盘角落」的符号。\ 和 | 本来就是同一个物理键的两态，
      # 放同一个触发键上；` 在左上角最远处，Markdown 代码块和 shell 都离不开它。
      - description: 'slash / = backslash'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: backslash } ]

      - description: 'command + slash / = pipe'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: backslash , modifiers: [ left_shift ] } ]

      - description: 'option + slash / = backtick'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: grave_accent_and_tilde } ]

      #==========================================================#
      # / -> language switch; command: chinese
      #==========================================================#
      # - description: 'slash = abc'
      #   type: basic
      #   from: { key_code: slash, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
      #   to: [ { select_input_source: { input_source_id: "^com\\.apple\\.keylayout\\.ABC$", language: "en" } } ]
      # - description: 'command + slash = rime'
      #   type: basic
      #   from: { key_code: slash, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
      #   to: [ { select_input_source: { input_mode_id: "^im\\.rime\\.inputmethod\\.Squirrel$", input_source_id: "^im\\.rime\\.inputmethod\\.Squirrel\\.Rime$", language: "zh-Hans" } } ]

  ################################################################
  #                      Hyper Mouse (Neru)                      #
  ################################################################
  - description: Hyper Mouse (Neru)
    manipulators:

      - description: 'option + i = mouse back'
        type: basic
        from: { key_code: i, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button4 } ]

      # normal: cursor move
      - description: 'option + o = mouse forward'
        type: basic
        from: { key_code: o, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button5 } ]

      # normal: cursor move

      - description: 'f = neru hints'
        type: basic
        from: { key_code: f, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru hints' } ]

      - description: 'g = neru grid'
        type: basic
        from: { key_code: g, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru grid' } ]

      - description: 'enter = mouse left click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button1 } ]

      - description: 'command + enter = mouse right click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_command ] } }
        to: [ { pointing_button: button2 } ]

      - description: 'option + enter = mouse middle click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_option ] } }
        to: [ { pointing_button: button3 } ]

      - description: 'command + g = neru recursive grid'
        type: basic
        from: { key_code: g, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_command ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru recursive_grid' } ]

      - description: 'r = exit mouse mode'
        type: basic
        from: { key_code: r, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }

      # 指针移动、滚轮、拖拽都搬进下面的「鼠标模式」，那里不用按住任何修饰键
      - description: 'r = enter mouse mode'
        type: basic
        from: { key_code: r, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to:
          - set_variable: { name: mouse_mode, value: 1 }
          - set_notification_message:
              id: mouse_mode
              text: "🖱 鼠标模式  hjkl 移动 · yuio 滚动 · ⌘ 加速 · ⌥ 减速 · 按住 Tab = 区域定位（右手主键区）· 按住 ` 或 ⌃ = 拖动 · n/⏎ 左键 · m 右键 · a/d 后退前进 · 123/qwe 跳屏 · space/esc 退出"

  ################################################################
  #                       Hyper Mouse Mode                       #
  #  Hyper+R 进入，模式内不需要按住任何修饰键，esc 退出。         #
  #  这样 a/s/d 和 hjkl 都能用最自然的姿势按，不再和 CapsLock    #
  #  抢左手小指——这也是它取代 ⌃⇧ 滚轮层和 ⌃⌥ 指针层的原因。     #
  ################################################################
  - description: Hyper Mouse Mode
    manipulators:

      # ── 区域定位：按住 space，右手主键区就是屏幕的缩略图 ──────────────
      # 3 排 × 5 列正好对上 yuiop / hjkl; / nm,./，K 落在屏幕正中心。
      # 比 Neru 的网格快，因为不用看屏幕读标签——想去右上就按 O，眼睛始终盯着目标。
      #
      # 已实测：set_mouse_cursor_position 省略 screen 时，百分比是相对「光标当前所在的
      # 那块屏幕」算的，不是主屏。所以这 15 条在三块屏上都对，不需要按屏各来一套。
      # 要换屏幕用 123 / qwe（那几条显式带 screen 参数）。
      #
      # 这批必须排在 hjkl / yuio / nm 那些规则前面：Karabiner 取第一条匹配就停，
      # 条件更严的（多一个 zone=1）放后面就永远轮不到。
      - description: 'mouse mode: zone y = zone 上左'
        type: basic
        from: { key_code: y }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 17% } } } ]

      - description: 'mouse mode: zone u = zone 上中左'
        type: basic
        from: { key_code: u }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 17% } } } ]

      - description: 'mouse mode: zone i = zone 上正'
        type: basic
        from: { key_code: i }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 17% } } } ]

      - description: 'mouse mode: zone o = zone 上中右'
        type: basic
        from: { key_code: o }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 70%, y: 17% } } } ]

      - description: 'mouse mode: zone p = zone 上右'
        type: basic
        from: { key_code: p }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 90%, y: 17% } } } ]

      - description: 'mouse mode: zone h = zone 中左'
        type: basic
        from: { key_code: h }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 50% } } } ]

      - description: 'mouse mode: zone j = zone 中中左'
        type: basic
        from: { key_code: j }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 50% } } } ]

      - description: 'mouse mode: zone k = zone 中正'
        type: basic
        from: { key_code: k }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50% } } } ]

      - description: 'mouse mode: zone l = zone 中中右'
        type: basic
        from: { key_code: l }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 70%, y: 50% } } } ]

      - description: 'mouse mode: zone semicolon = zone 中右'
        type: basic
        from: { key_code: semicolon }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 90%, y: 50% } } } ]

      - description: 'mouse mode: zone n = zone 下左'
        type: basic
        from: { key_code: n }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 83% } } } ]

      - description: 'mouse mode: zone m = zone 下中左'
        type: basic
        from: { key_code: m }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 83% } } } ]

      - description: 'mouse mode: zone comma = zone 下正'
        type: basic
        from: { key_code: comma }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 83% } } } ]

      - description: 'mouse mode: zone period = zone 下中右'
        type: basic
        from: { key_code: period }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 70%, y: 83% } } } ]

      - description: 'mouse mode: zone slash = zone 下右'
        type: basic
        from: { key_code: slash }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 90%, y: 83% } } } ]

      - description: 'mouse mode: h = mouse move left'
        type: basic
        from: { key_code: h }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { x: -1600 } } ]

      - description: 'mouse mode: l = mouse move right'
        type: basic
        from: { key_code: l }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { x: 1600 } } ]

      - description: 'mouse mode: j = mouse move down'
        type: basic
        from: { key_code: j }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { y: 1600 } } ]

      - description: 'mouse mode: k = mouse move up'
        type: basic
        from: { key_code: k }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { y: -1600 } } ]

      #==========================================================#
      # ( u i o p ) 滚轮 —— 内侧一对管垂直，外侧一对管水平        #
      #==========================================================#
      # 排布依据是**频率 × 难度**，不是方向对称：
      #   · 垂直滚动比水平滚动至少高一个数量级（网页、代码、聊天全是竖着滚）
      #   · i / o 是中指和无名指，正上方直达、毫无负担，是这排最好按的一对
      #   · u 虽然是食指，但食指在 hjkl 里已经要管 h 和 j 两个键，是最忙的一根
      #   · p 是小指，最弱
      # 所以高频的垂直给 i/o，低频的水平给 u/p。
      #
      # 这也正是导航层 uiop 的真实规律——它遵循的不是「外侧垂直」，而是
      # 「内侧高频、外侧低频」：i=Home 行首、o=End 行尾都是编辑时的高频操作，
      # u/p 的翻页是低频。两个位面因此共用同一条原则。
      #
      # i / o 谁上谁下，借导航层现成的隐喻：i=Home 是「开头」→ 往上滚，
      # o=End 是「结尾」→ 往下滚。u/p 取位置顺序，u 最左、p 最右。
      #
      # 速度基准回到 64，而且**不要再靠它调手感**。
      #
      # 原因：mouse_key 是按整格累积后才发事件的，值调低到一定程度，一次点按
      # （按住 30~80ms）根本凑不满一整格，于是一个事件都不发——实测 20 时点按
      # 完全没反应，而连按因为时间够长能累积得起来。「点按能触发」和「连按不过快」
      # 在单一数值上是矛盾的。
      #
      # 所以拆成两层：这里只负责**有没有事件**（64 保证点按稳稳越过阈值），
      # **每个事件滚多远**交给 ScrollGuard 的平滑模式（~/workspace/personal/ScrollGuard）——
      # 它把整格事件改写成像素级连续事件，像素没有量化下限，要多慢有多慢。
      # 调手感请改那边的 pixelsPerLine，不要回来动这个数。
      # 值取 128 而不是 64，是为了让**减速档**也过得了阈值：⌥ 砍半后是 64，
      # 一次 50ms 的点按能累积 3 行，稳稳发得出事件；64 的话减速档只剩 32，
      # 点按又会凑不满一格（实测如此）。
      # 速度靠 ScrollGuard 那边等比降下来：128 行/秒 × 6 px/行 ≈ 770 px/s，不变。
      #
      # 实测（playground/mouse-diag/scrollrate）：Karabiner 的事件率只有 ~15Hz，
      # 触控板是 ~61Hz。所以提高这个值买不到密度，只会让每个事件裹更多行
      # （实测单事件 delta 已经到 1~7）。要真正顺滑得靠 ScrollGuard 做插值。
      #
      # 注意 speed_multiplier 是全局的，同时作用于指针和滚轮，所以要拉开滚轮的
      # 快慢差距**不能**去动那两个倍率——只能改这里的基准值。
      # 想精确校准跑 playground/mouse-diag/scrollrate，它会直接报「几秒一屏」。
      #
      # 不跟上游：上游滚轮的 uiop 是 hjkl 的逆序镜像（右上下左），拿来白送一套
      # 「自然滚动/反向」，代价是和它自己的导航层对不上。
      #
      # 另：物理上位于 hjkl 正上方的其实是 yuio（偏移仅 0.25 键宽，用本仓库
      # keymap.yml 的布局数据量过）。选 uiop 是取「手指读法」——右手实际按在
      # jkl; 上、食指左伸够 h，四指上抬正好落在 uiop。y 因此在鼠标模式里空出来了
      # （区域定位层仍在用它）。
      - description: 'mouse mode: i = mouse wheel up'
        type: basic
        from: { key_code: i }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { vertical_wheel: -32 } } ]

      - description: 'mouse mode: o = mouse wheel down'
        type: basic
        from: { key_code: o }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { vertical_wheel: 32 } } ]

      - description: 'mouse mode: u = mouse wheel left'
        type: basic
        from: { key_code: u }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { horizontal_wheel: 32 } } ]

      - description: 'mouse mode: p = mouse wheel right'
        type: basic
        from: { key_code: p }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { horizontal_wheel: -32 } } ]

      #==========================================================#
      # ( 修饰键 ) 变速与拖拽                                    #
      #  模式内没有按住 CapsLock，⌥⌘⇧ 三个修饰键全是空的。        #
      #  ⌥ 加速：和文本导航里 ⌥「按词跳」的加速语义保持一致。      #
      #  按住只置一个变量，具体快多少由上面每条移动规则自己决定。  #
      #  ⇧ 拖拽可以和 ⌥/⌘ 叠加，用于精细框选。                    #
      #==========================================================#

      # 加减速用 speed_multiplier，不用变量：变量条件只在按键按下那一刻求值，
      # 已经在移动中的 hjkl 不会因为变量变了就重新选规则——这是「移动中调速无效」的根因。
      # speed_multiplier 是持续生效的乘数，对正在进行的移动实时起作用，
      # 所以可以按住 hjkl 不松手，中途再按 ⌘/⌥ 变速。
      #
      # 数值沿用上游 Vonng/Capslock 的设计：三档是严格对称的 0.5 / 1 / 2，
      # 指针和滚轮共用同一套比例。这一点很关键——正因为两边同比例，
      # speed_multiplier 全局生效才不成问题：
      #   指针  800 / 1600 / 3200
      #   滚轮   32 /   64 /  128
      # 想改倍率的话记住它同时作用于两者，别只盯着指针调。
      #
      # 已知偏差：同时按 hjkl 里的两个键斜着走，合速度是 √2 倍（约快 41%）。
      # 上游是给对角线单独分配按键并除以 √2 来解决的，我们用组合键就没这个余地。
      #
      # ⌘ 放加速：拇指自然落点离 ⌘ 最近，而加速比减速用得多。
      - description: 'mouse mode: command = mouse fast'
        type: basic
        from: { key_code: left_command }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { speed_multiplier: 2 } } ]

      # ⚠️ 已知缺陷：滚轮的减速档在当前基准值（32）下工作在**量化底部**，不可用。
      # 实测（playground/mouse-diag/scrollrate，探针挂 HID 层）：
      #
      #                标准档(base 64)   减速档(base 32 × 0.5 = 期望 16)
      #   事件率          15 Hz              6 Hz        ← 变稀，不只是变小
      #   行/秒           66 (≈base ✓)       6           ← 期望 16，少 62%
      #   每事件行数      1~7                恒为 1
      #   像素/秒         710                6           ← 227 秒一屏，等于不动
      #
      # 更要紧的是**三个字段在低速下互相矛盾，差 10 倍**：
      #   DeltaAxis1   = 1       整数行，向上取整的结果
      #   FixedPtDelta = 6554    = 0.1 行，Karabiner 内部算出的真实位移
      #   PointDelta1  = 1       = 1 像素
      # 读哪个字段就得到完全不同的速度。应用大概率读 PointDelta，于是几乎不动。
      #
      # 根因是 speed_multiplier 把工作点推到了 mouse_key 的整格量化阈值以下，
      # 在那里它的行为已经不自洽。**不是 macOS 的滚动加速曲线**——探针在 HID 层，
      # 事件还没进渲染就已经这样了。
      #
      # 修法（未做，因为减速档用得不多）：把工作点抬离底部——
      #   基准值 32 → 128，同时 ScrollGuard 的 pixelsPerLine 20 → 5（积不变，
      #   标准档速度一样），减速档就变成 64 行/秒，远离阈值。
      # 指针不受影响：它的基准是 1600，减速后 800，离量化底部很远。
      - description: 'mouse mode: option = mouse slow'
        type: basic
        from: { key_code: left_option }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { mouse_key: { speed_multiplier: 0.5 } } ]

      # ⌃ 拖动主要给 ⇪R 常驻模式用——那时左手完全空闲，拇指按 ⌃ 最省事。
      # 按住 M2 的临时模式下用不上（拇指要留给 ⌘/⌥ 变速），那边走 ` 键。
      # ⇧ 已删：按住 M2 时左小指钉在最左列，和 ⇧ 是同一根手指，够不着。
      - description: 'mouse mode: control = mouse select'
        type: basic
        from: { key_code: left_control }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # ` 在 Tab 正上方，同一根无名指上下一格：下面定位，上面拖动。
      # 和 ⇧ / ⌃ / F / N 一样都是 button1——按住即拖，松开即放。
      - description: 'mouse mode: grave = mouse select'
        type: basic
        from: { key_code: grave_accent_and_tilde }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # Tab 按住 = 进区域定位层。M2 就在 Tab 左边，小指按 M2、无名指按 Tab，
      # 两个相邻键。连续拖拽仍然可以按住 ⇧ / ⌃ / F / N（都是同一个 button1）。
      - description: 'mouse mode: tab = zone layer'
        type: basic
        from: { key_code: tab }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { set_variable: { name: zone, value: 1 } } ]
        to_after_key_up: [ { set_variable: { name: zone, value: 0 } } ]

      - description: 'mouse mode: enter = mouse left click'
        type: basic
        from: { key_code: return_or_enter }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      # 点击全部收在右手：n/m 就在 j/k 正下方，移动指针的手指顺势下落就能点。
      # 左手的 f/g 已删——按住 M2 时左手在最左列，那两个键本来就不顺手。
      - description: 'mouse mode: n = mouse left click'
        type: basic
        from: { key_code: n }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button1 } ]

      - description: 'mouse mode: m = mouse right click'
        type: basic
        from: { key_code: m }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button2 } ]

      - description: 'mouse mode: a = mouse back'
        type: basic
        from: { key_code: a }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button4 } ]

      - description: 'mouse mode: d = mouse forward'
        type: basic
        from: { key_code: d }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { pointing_button: button5 } ]

      #==========================================================#
      # ( 123 / qwe ) 指针跳到第 N 块屏幕正中                     #
      #==========================================================#

      - description: 'mouse mode: 1 = jump to screen 1'
        type: basic
        from: { key_code: '1' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 1 } } } ]

      - description: 'mouse mode: q = jump to screen 1'
        type: basic
        from: { key_code: q }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 1 } } } ]

      - description: 'mouse mode: 2 = jump to screen 2'
        type: basic
        from: { key_code: '2' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 0 } } } ]

      - description: 'mouse mode: w = jump to screen 2'
        type: basic
        from: { key_code: w }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 0 } } } ]

      - description: 'mouse mode: 3 = jump to screen 3'
        type: basic
        from: { key_code: '3' }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 2 } } } ]

      - description: 'mouse mode: e = jump to screen 3'
        type: basic
        from: { key_code: e }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 50%, y: 50%, screen: 2 } } } ]

      #==========================================================#
      # ( space / esc ) 退出                                     #
      #==========================================================#

      - description: 'mouse mode: space = exit mouse mode'
        type: basic
        from: { key_code: spacebar }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_variable: { name: zone, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }

      - description: 'mouse mode: escape = exit mouse mode'
        type: basic
        from: { key_code: escape }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }
