  ################################################################
  #                        Hyper Shifter                         #
  ################################################################
  - description: Hyper Shifter
    manipulators:

      #==========================================================#
      # [] -> () command:{}  option:<>
      #==========================================================#
      # 括号搬到底排的 , . ：右手中指 + 无名指各管一边，左键出左括号、右键出右括号，
      # 空间关系和符号本身同构。⇧, = < 和 ⇧. = > 在标准布局里本来就是括号类，位置有先验联想。
      # 只输出单个原生字符，成对补全交给编辑器自己处理，两层职责不重叠。
      - description: 'comma , = ('
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '9' , modifiers: [ left_shift ] } ]

      - description: 'command + comma , = {'
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: open_bracket , modifiers: [ left_shift ] } ]

      - description: 'option + comma , = ['
        type: basic
        from: { key_code: comma, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: open_bracket } ]

      - description: 'period . = )'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '0' , modifiers: [ left_shift ] } ]

      - description: 'command + period . = }'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: close_bracket , modifiers: [ left_shift ] } ]

      - description: 'option + period . = ]'
        type: basic
        from: { key_code: period, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: close_bracket } ]

      - description: 'semicolon = _'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: 'hyphen' , modifiers: [ left_shift ] } ]

      - description: 'command + semicolon = -'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: hyphen } ]

      - description: 'option + semicolon = $'
        type: basic
        from: { key_code: semicolon, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '4' , modifiers: [ left_shift ] } ]

      - description: 'quote = equal_sign'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: equal_sign } ]

      - description: 'command + quote = +'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: equal_sign , modifiers: [ left_shift ] } ]

      - description: 'option + quote = &'
        type: basic
        from: { key_code: quote, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: '7' , modifiers: [ left_shift ] } ]

      # 斜杠组：三个「手必须够到键盘角落」的符号。\ 和 | 本来就是同一个物理键的两态，
      # 放同一个触发键上；` 在左上角最远处，Markdown 代码块和 shell 都离不开它。
      - description: 'slash / = backslash'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: backslash } ]

      - description: 'command + slash / = pipe'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: backslash , modifiers: [ left_shift ] } ]

      - description: 'option + slash / = backtick'
        type: basic
        from: { key_code: slash, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { key_code: grave_accent_and_tilde } ]

      #==========================================================#
      # / -> language switch; command: chinese
      #==========================================================#
      # - description: 'slash = abc'
      #   type: basic
      #   from: { key_code: slash, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
      #   to: [ { select_input_source: { input_source_id: "^com\\.apple\\.keylayout\\.ABC$", language: "en" } } ]
      # - description: 'command + slash = rime'
      #   type: basic
      #   from: { key_code: slash, modifiers: { mandatory: [ left_command, right_command,right_control,right_shift,right_option ] } }
      #   to: [ { select_input_source: { input_mode_id: "^im\\.rime\\.inputmethod\\.Squirrel$", input_source_id: "^im\\.rime\\.inputmethod\\.Squirrel\\.Rime$", language: "zh-Hans" } } ]

  ################################################################
  #                      Hyper Mouse (Neru)                      #
  ################################################################
  - description: Hyper Mouse (Neru)
    manipulators:

      - description: 'option + i = mouse back'
        type: basic
        from: { key_code: i, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button4 } ]

      # normal: cursor move
      - description: 'option + o = mouse forward'
        type: basic
        from: { key_code: o, modifiers: { mandatory: [ left_option, right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button5 } ]

      # normal: cursor move

      - description: 'f = neru hints'
        type: basic
        from: { key_code: f, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru hints' } ]

      - description: 'g = neru grid'
        type: basic
        from: { key_code: g, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru grid' } ]

      - description: 'enter = mouse left click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to: [ { pointing_button: button1 } ]

      - description: 'command + enter = mouse right click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_command ] } }
        to: [ { pointing_button: button2 } ]

      - description: 'option + enter = mouse middle click'
        type: basic
        from: { key_code: return_or_enter, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_option ] } }
        to: [ { pointing_button: button3 } ]

      - description: 'command + g = neru recursive grid'
        type: basic
        from: { key_code: g, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option,left_command ] } }
        to: [ { shell_command: '/opt/homebrew/bin/neru recursive_grid' } ]

      - description: 'r = exit mouse mode'
        type: basic
        from: { key_code: r, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 } ]
        to:
          - set_variable: { name: mouse_mode, value: 0 }
          - set_notification_message: { id: mouse_mode, text: "" }

      # 指针移动、滚轮、拖拽都搬进下面的「鼠标模式」，那里不用按住任何修饰键
      - description: 'r = enter mouse mode'
        type: basic
        from: { key_code: r, modifiers: { mandatory: [ right_command,right_control,right_shift,right_option ] } }
        to:
          - set_variable: { name: mouse_mode, value: 1 }
          - set_notification_message:
              id: mouse_mode
              text: "🖱 鼠标模式  hjkl 移动 · yuio 滚动 · ⌘ 加速 · ⌥ 减速 · 按住 Tab = 区域定位（右手主键区）· 按住 ` 或 ⌃ = 拖动 · n/⏎ 左键 · m 右键 · a/d 后退前进 · 123/qwe 跳屏 · space/esc 退出"

  ################################################################
  #                       Hyper Mouse Mode                       #
  #  Hyper+R 进入，模式内不需要按住任何修饰键，esc 退出。         #
  #  这样 a/s/d 和 hjkl 都能用最自然的姿势按，不再和 CapsLock    #
  #  抢左手小指——这也是它取代 ⌃⇧ 滚轮层和 ⌃⌥ 指针层的原因。     #
  ################################################################
  - description: Hyper Mouse Mode
    manipulators:

      # ── 区域定位：按住 space，右手主键区就是屏幕的缩略图 ──────────────
      # 3 排 × 5 列正好对上 yuiop / hjkl; / nm,./，K 落在屏幕正中心。
      # 比 Neru 的网格快，因为不用看屏幕读标签——想去右上就按 O，眼睛始终盯着目标。
      #
      # 已实测：set_mouse_cursor_position 省略 screen 时，百分比是相对「光标当前所在的
      # 那块屏幕」算的，不是主屏。所以这 15 条在三块屏上都对，不需要按屏各来一套。
      # 要换屏幕用 123 / qwe（那几条显式带 screen 参数）。
      #
      # 这批必须排在 hjkl / yuio / nm 那些规则前面：Karabiner 取第一条匹配就停，
      # 条件更严的（多一个 zone=1）放后面就永远轮不到。
      - description: 'mouse mode: zone y = zone 上左'
        type: basic
        from: { key_code: y }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 10%, y: 17% } } } ]

      - description: 'mouse mode: zone u = zone 上中左'
        type: basic
        from: { key_code: u }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
        to: [ { software_function: { set_mouse_cursor_position: { x: 30%, y: 17% } } } ]

      - description: 'mouse mode: zone i = zone 上正'
        type: basic
        from: { key_code: i }
        conditions: [ { type: variable_if, name: mouse_mode, value: 1 }, { type: variable_if, name: zone, value: 1 } ]
